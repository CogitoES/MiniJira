spring.datasource.url=jdbc:h2:mem:minijiradb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=YhCZHWj0CkZU+HIMHLC539V0iITbcGmV6wyeeWKkba5j3k+zKSlLRxtwHjeGb3xBa7e+i3WQDIyKjqN6kGqVcw==
app.jwt.expiration-ms=86400000

# SQL Initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.check-location=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Jira Integration
jira.url=${JIRA_URL}
jira.email=${JIRA_EMAIL}
jira.api-token=${JIRA_API_TOKEN}
jira.lead-account-id=${JIRA_LEAD_ACCOUNT_ID}
