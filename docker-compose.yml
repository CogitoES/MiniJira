services:
  # The monolith we are currently strangling
  monolith:
    build: .
    env_file:
      - .env
    ports:
      - "8081:8080" # Moved from 8080 to 8081 to free 8080 for the gateway

  # The future entry point
  gateway:
    image: springcloud/spring-cloud-gateway # Placeholder
    ports:
      - "8080:8080"
    depends_on:
      - monolith
      - auth-service

  # The future Auth service
  auth-service:
    build: ./auth-service # Placeholder for Phase 3
    env_file:
      - .env
    depends_on:
      - monolith

  comment-service:
    build: ./comment-service
    env_file:
      - .env
    depends_on:
      - monolith

  jira-service:
    build: ./jira-service
    env_file:
      - .env
    depends_on:
      - monolith

  project-service:
    build: ./project-service
    env_file:
      - .env
    depends_on:
      - monolith

  task-service:
    build: ./task-service
    env_file:
      - .env
    depends_on:
      - monolith

  frontend:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - gateway
