services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JIRA_URL=${JIRA_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_LEAD_ACCOUNT_ID=${JIRA_LEAD_ACCOUNT_ID}

  frontend:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - backend
